 client.manager;

 net.minecraft.client.Minecraft;
 net.minecraft.util.text.StringTextComponent;

 java.io.BufferedReader;
 java.io.FileReader;
 java.io.IOException;
 java.util.ArrayList;
 java.util.List;

 AltManager {
    List<Account> accounts =  ArrayList<>();
    currentIndex = 0;

    loadAlts(String filePath)  IOException {
        BufferedReader reader = ne BufferedReader(ne FileReader(filePath));
        String line;
        whil ((line = reader.readLine()) != null) {
            String[] parts = line.split(":");
            i (parts.length >= 2) {
                accounts.add(ne Account(parts[0], parts[1]));
            }
        }
        reader.close();
        System.out.println("[AltManager] Загружено " + accounts.size() + " аккаунтов.");
    }

    publi autoLogin() {
        i (accounts.isEmpty()) {
            System.out.println("[AltManager] Список аккаунтов пуст.");
            retur
        }
        Account acc = accounts.get(currentIndex);
        i (Minecraft.getInstance().player != null) {
            Minecraft.getInstance().player.sendMessage(
                ne StringTextComponent("/login " + acc.password),
                Minecraft.getInstance().player.getUUID()
            );
            System.out.println("[AltManager] Авторизация для: " + acc.username);
        }
    }

     switchToNext() {
        i (accounts.isEmpty()) 
        currentIndex = (currentIndex + 1) % accounts.size();
        System.out.println("[AltManager] Переключено на: " + accounts.get(currentIndex).username);
    }

    publi Account getCurrentAccount() {
        i (accounts.isEmpty()) retur null;
        retur accounts.get(currentIndex);
    }

    publi stati clas Account {
        publi String username;
        publi String password;

        publi Account(String username, String password) {
            this.username = username;
            this.password = password;
        }
    }
}
